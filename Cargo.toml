[package]
name = "okulfotoeditor"
version = "0.1.0"
edition = "2021"
authors = ["YSR"]
description = "e-Okul Öğrenci Fotoğrafı Hazırlama ve Otomatik İsimlendirme Masaüstü GUI Uygulaması"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
image = { version = "0.25", features = ["jpeg", "png"] }
kamadak-exif = "0.6"
anyhow = "1.0"
